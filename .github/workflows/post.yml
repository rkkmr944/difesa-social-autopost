name: Difesa Scheduled Social Post

# Runs every Mon/Wed/Fri at 10:00 AM IST (04:30 UTC).
# You can also trigger it manually from the Actions tab ("Run workflow")
# to test on demand, or with a specific date.
on:
  schedule:
    - cron: "30 4 * * 1,3,5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional: post a specific date (YYYY-MM-DD) instead of today"
        required: false
        default: ""
      dry_run:
        description: "Dry run only (check image + print, don't post)"
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled post
        env:
          FACEBOOK_ENABLED: ${{ secrets.FACEBOOK_ENABLED }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

          INSTAGRAM_ENABLED: ${{ secrets.INSTAGRAM_ENABLED }}
          INSTAGRAM_IG_BUSINESS_ID: ${{ secrets.INSTAGRAM_IG_BUSINESS_ID }}
          INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}

          LINKEDIN_ENABLED: ${{ secrets.LINKEDIN_ENABLED }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}

          GOOGLE_BUSINESS_PROFILE_ENABLED: ${{ secrets.GOOGLE_BUSINESS_PROFILE_ENABLED }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          GBP_ACCESS_TOKEN: ${{ secrets.GBP_ACCESS_TOKEN }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}

          TWITTER_X_ENABLED: ${{ secrets.TWITTER_X_ENABLED }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/run_scheduled_post.py $ARGS

      - name: Upload run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-result-${{ github.run_id }}
          path: posts/
          if-no-files-found: ignore
