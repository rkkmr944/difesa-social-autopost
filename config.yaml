# ============================================================
# Difesa Security — Social Auto-Post Configuration
# ============================================================
# Copy this file to config.yaml and fill in real values.
# config.yaml is gitignored / never shared — it holds live tokens.
#
# Leave a platform's block EMPTY (keep enabled: false) and the
# pipeline will just generate that platform's content/image and
# skip posting — you can publish it manually instead.
# ============================================================

brand:
  name: "Difesa Security Services"
  website: "https://difesasecurityservices.com"
  phone: "080-25505649"
  tagline: "Real Protection. Real Trust."
  default_cta: "Get a Free Quote"

# Images are no longer generated by this pipeline. Kashyap uploads each
# post's photo directly to https://difesasecurityservices.com/social/<date>.jpg
# via FTP (see content_calendar.csv for what's needed and when). The
# scheduled run checks that URL is live before posting — nothing else
# to configure here.

facebook:
  enabled: false
  page_id: ""                 # Facebook Page ID
  page_access_token: ""       # long-lived Page Access Token (Graph API)

instagram:
  enabled: false
  ig_business_id: ""          # Instagram Business Account ID (linked to the FB Page)
  page_access_token: ""       # same Page Access Token as Facebook, needs instagram_content_publish scope
  # Image URL comes straight from content_calendar.json (difesasecurityservices.com/social/<date>.jpg).

linkedin:
  enabled: false
  organization_urn: ""        # e.g. urn:li:organization:12345678
  access_token: ""            # OAuth token with w_organization_social scope

google_business_profile:
  enabled: false
  account_id: ""               # from accounts.list
  location_id: ""              # from locations.list
  access_token: ""             # OAuth 2.0 access token (refreshed via refresh_token)
  refresh_token: ""
  client_id: ""
  client_secret: ""

twitter_x:
  enabled: false               # NOTE: X API has no free posting tier as of 2026 (pay-per-post).
  api_key: ""
  api_secret: ""
  access_token: ""
  access_token_secret: ""

schedule:
  days: ["Mon", "Wed", "Fri"]
  time_ist: "10:00"
